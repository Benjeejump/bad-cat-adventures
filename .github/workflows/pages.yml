name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage only public game files
        run: |
          mkdir public
          cp index.html styles.css app.js cinematics.js word-bank.js spelling.js learning.css loot.js game-map.js game-map-style.json puppy-options.js campaign.js targeting.js adventure.js site-config.js map-mode.css sw.js manifest.webmanifest public/
          cp -r assets public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
